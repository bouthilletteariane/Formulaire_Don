<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Don Centraide</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>

    <h1 class="text-4xl text-center">Je souhaite donner à Centraide</h1>

   <form action="merci.html" method="get">
      <!-- SECTION 1: DON -->
      <fieldset class="border-2">
        <legend class="p-2">Information sur votre don :</legend>
        <div class="m-2">
        <p class="text-red-600">Choisissez votre option :</p>
        <input class="type_don" type="radio" id="frequence_unique" name="frequence_don" value="unique" checked>
        <label for="frequence_unique">Versement unique</label>

        <input class="type_don" type="radio" id="frequence_periodique" name="frequence_don" value="periodique">
        <label for="frequence_periodique">Versement périodique</label>
        
        <p>Montant fixe :</p>
        <input class="type_don" type="radio" id="montant_10" name="montant_fixe" value="10">
        <label for="montant_10">10$</label>

        <input class="type_don" type="radio" id="montant_50" name="montant_fixe" value="50">
        <label for="montant_50">50$</label>

        <input class="type_don" type="radio" id="montant_100" name="montant_fixe" value="100">
        <label for="montant_100">100$</label>

        <input class="type_don" type="radio" id="montant_200" name="montant_fixe" value="200">
        <label for="montant_200">200$</label>

        <br>
        <label for="montant_custom">Autre montant :</label>
        <input class="border rounded p-1"type="number" id="montant_custom" name="montant_libre" placeholder="0"> $
       </div>
          <button class="border-2 m-2 pl-3 pr-3">
            <a>
              Suivant
            </a>
          </button>
      </fieldset>

     

      <!-- SECTION 2: COORDONNÉES -->
      <fieldset class="border-2">
        <legend class="p-2">Vos coordonnées</legend>
        <div class="m-3">
        <div>
          <label for="nom">Nom :</label>
          <input class="border rounded"type="text" id="nom" name="nom" required>
        </div>

        <div>
          <label for="prenom">Prénom :</label>
          <input class="border rounded"type="text" id="prenom" name="prenom" required>
        </div>

        <div>
          <label for="entreprise">Entreprise (facultatif) :</label>
          <input class="border rounded"type="text" id="entreprise" name="entreprise">
        </div>

        <div>
          <label for="email">E-mail :</label>
          <input class="border rounded"type="email" id="email" name="email" required>
        </div>

        <div>
          <label for="adresse">Adresse :</label>
          <input class="border rounded" type="text" id="adresse" name="adresse" required>
        </div>
        </div>
      </fieldset>

      <!-- SECTION 3: PAIEMENT -->
      <fieldset class="border-2">   
        <legend class="p-2">Mode de paiement</legend>
        <div class="m-3">
        <p>Type de paiement:</p>
        <input class="type_don" type="radio" id="carte_credit" name="type_carte" value="credit">
        <label for="carte_visa">Crédit</label>

        <input class="type_don" type="radio" id="carte_paypal" name="type_carte" value="paypal">
        <label for="carte_paypal">PayPal</label>
        <br><br>

        <label for="cc-number">Numéro de carte :</label>
        <input type="tel" id="cc-number" name="numero_carte" inputmode="numeric"  maxlength="19" required>
        
        <div>
          <label for="expiration">Expiration :</label>
          <input type="text" id="expiration" name="expiration_carte"  required>
        </div>
        </div>
      </fieldset>

      <!-- SECTION 4: RÉSUMÉ -->
      <fieldset>
        <legend>Résumé du don</legend>
        <div>
          <h2>Nom complet : <span id="resume_nom"></span></h2>
        </div>
        <div>
          <h2>Montant : <span id="resume_montant"></span></h2>
        </div>
      </fieldset>

      <button type="submit">Envoyer le don</button>
    </form>
  </body>
</html>
